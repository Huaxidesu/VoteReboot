# This workflow can be triggered manually to build the plugin
# For more information see: https://docs.github.com/actions/using-workflows/manually-running-a-workflow

name: Manual Build with Maven

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'
    - name: Build with Maven
      run: mvn -B clean package --file pom.xml
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: VoteReboot_manual.jar
        # A file, directory or wildcard pattern that describes what to upload
        path: target/VoteReboot.jar
