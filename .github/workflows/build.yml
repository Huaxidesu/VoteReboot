# Build the plugin with Maven.
# - push / pull_request: CI build, artifact upload only
# - workflow_dispatch (manual run): build and publish a GitHub Release with the runnable jar
# For more information see: https://docs.github.com/actions/using-workflows/manually-running-a-workflow

name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（例如 v2.3）'
        required: true
        default: 'v2.3'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'
    - name: Build with Maven
      run: mvn -B clean package --file pom.xml
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: VoteReboot.jar
        # A file, directory or wildcard pattern that describes what to upload
        path: target/VoteReboot.jar
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.inputs.tag }}
      run: |
        cp target/VoteReboot.jar "VoteReboot-${TAG}.jar"
        gh release create "$TAG" "VoteReboot-${TAG}.jar" \
          --title "VoteReboot $TAG" \
          --generate-notes
